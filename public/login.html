<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso | KDev Studio</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: radial-gradient(
          circle at top,
          #18382b 0%,
          #0d1713 38%,
          #080c0a 100%
        );
        color: #fff;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        padding: 38px 32px;
        border-radius: 20px;
        background: rgba(18, 27, 23, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      }

      .brand {
        text-align: center;
        margin-bottom: 32px;
      }

      .brand-badge {
        width: 58px;
        height: 58px;
        margin: 0 auto 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 16px;
        background: #20c875;
        color: #07110c;
        font-size: 24px;
        font-weight: 800;
        box-shadow: 0 10px 30px rgba(32, 200, 117, 0.2);
      }

      .brand h1 {
        font-size: 25px;
        margin-bottom: 7px;
      }

      .brand p {
        color: #96a39d;
        font-size: 14px;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5d0;
        font-size: 13px;
        font-weight: 600;
      }

      input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid #34433c;
        outline: none;
        background: #0d1511;
        color: #fff;
        font-size: 15px;
        transition: 0.2s;
      }

      input:focus {
        border-color: #20c875;
        box-shadow: 0 0 0 3px rgba(32, 200, 117, 0.1);
      }

      button {
        width: 100%;
        height: 50px;
        margin-top: 8px;
        border: none;
        border-radius: 10px;
        background: #20c875;
        color: #07110c;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
      }

      #mensaje {
        min-height: 20px;
        margin-top: 16px;
        text-align: center;
        color: #ff7070;
        font-size: 13px;
      }

      .footer {
        margin-top: 22px;
        text-align: center;
        color: #637068;
        font-size: 12px;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 30px 22px;
        }
      }
    </style>
  </head>

  <body>
    <main class="login-card">
      <div class="brand">
        <div class="brand-badge">&lt;/&gt;</div>

        <h1>Oficina Meta</h1>
        <p>Panel de administración</p>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" type="text" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>

        <button id="login-button" type="submit">Iniciar sesión</button>

        <div id="mensaje"></div>
      </form>

      <div class="footer">Acceso privado · KDev Studio</div>
    </main>
    <script>
      const loginForm = document.getElementById("login-form");
      const loginButton = document.getElementById("login-button");
      const mensaje = document.getElementById("mensaje");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        loginButton.disabled = true;
        loginButton.textContent = "Ingresando...";
        mensaje.textContent = "";

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              username,
              password,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "No se pudo iniciar sesión");
          }

          // Login correcto → vamos al panel
          window.location.href = "/panel";
        } catch (error) {
          mensaje.textContent = "❌ " + error.message;

          loginButton.disabled = false;
          loginButton.textContent = "Iniciar sesión";
        }
      });
    </script>
  </body>
</html>
