<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de control</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .panel {
        width: 90%;
        max-width: 500px;
        background: #1e1e1e;
        padding: 30px;
        border-radius: 16px;
      }

      h1 {
        margin-top: 0;
      }

      .actual {
        background: #292929;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        font-size: 17px;
        border-radius: 8px;
        border: 1px solid #444;
        margin-bottom: 12px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #25d366;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
      }
      .btnclose {
        width: 50%;
        padding: 5px;
        border: none;
        border-radius: 10px;
        background: #ff4d4d;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
      }

      #mensaje {
        margin-top: 15px;
      }
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        font-size: 17px;
        border-radius: 8px;
        border: 1px solid #444;
        margin-bottom: 12px;
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <button id="logout-button" type="button" class="btnclose">
        Cerrar sesión
      </button>
      <h1>Panel de control</h1>

      <h2>WhatsApp receptor</h2>

      <div class="actual">
        Número actual:
        <strong id="numero-actual">Cargando...</strong>
      </div>

      <input id="nuevo-numero" type="tel" placeholder="Ej: 5492231234567" />

      <button id="guardar">Cambiar número</button>

      <div id="mensaje"></div>

      <hr style="margin: 30px 0; border-color: #444" />
      <!-- /*REGISTRAR COMPRA*/ -->

      <h2>Registrar compra</h2>

      <input
        id="purchase-phone"
        type="tel"
        placeholder="Teléfono del comprador. Ej: 5492231234567"
      />
      <input
        type="text"
        id="purchase-reference"
        placeholder="Referencia (ej: d2f8a0ee)"
        maxlength="8"
      />
      <input
        id="purchase-value"
        type="number"
        min="0"
        step="0.01"
        placeholder="Importe de la venta"
      />

      <select id="purchase-currency">
        <option value="ARS">ARS - Pesos argentinos</option>
        <option value="USD">USD - Dólares</option>
      </select>

      <button id="registrar-compra">Registrar compra en Meta</button>

      <div id="purchase-mensaje"></div>
    </div>

    <script>
      const numeroActual = document.getElementById("numero-actual");
      const nuevoNumero = document.getElementById("nuevo-numero");
      const mensaje = document.getElementById("mensaje");

      async function cargarNumero() {
        try {
          const response = await fetch("/api/whatsapp");
          const data = await response.json();

          numeroActual.textContent = data.number;
        } catch (error) {
          numeroActual.textContent = "Error";
        }
      }

      document
        .getElementById("guardar")
        .addEventListener("click", async function () {
          mensaje.textContent = "Guardando...";

          try {
            const response = await fetch("/api/whatsapp", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                number: nuevoNumero.value,
              }),
            });

            const data = await response.json();

            if (!response.ok) {
              mensaje.textContent = data.message;
              return;
            }

            numeroActual.textContent = data.number;
            nuevoNumero.value = "";

            mensaje.textContent = "✅ Número actualizado correctamente.";
          } catch (error) {
            mensaje.textContent = "❌ No se pudo actualizar el número.";
          }
        });

      cargarNumero();
      const purchasePhone = document.getElementById("purchase-phone");
      const purchaseValue = document.getElementById("purchase-value");
      const purchaseCurrency = document.getElementById("purchase-currency");
      const purchaseMensaje = document.getElementById("purchase-mensaje");
      const registrarCompra = document.getElementById("registrar-compra");

      registrarCompra.addEventListener("click", async function () {
        const phone = purchasePhone.value.trim();
        const reference = document
          .getElementById("purchase-reference")
          .value.trim();
        const value = purchaseValue.value;
        const currency = purchaseCurrency.value;

        if (!phone || !value) {
          purchaseMensaje.textContent = "❌ Completá el teléfono y el importe.";
          return;
        }

        registrarCompra.disabled = true;
        registrarCompra.textContent = "Enviando...";
        purchaseMensaje.textContent = "";

        try {
          const response = await fetch("/api/purchase", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              phone,
              reference,
              value,
              currency,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            purchaseMensaje.textContent =
              "❌ " + (data.message || "No se pudo registrar la compra.");
            return;
          }

          purchaseMensaje.textContent =
            "✅ Compra enviada correctamente a Meta.";

          purchasePhone.value = "";
          purchaseValue.value = "";
        } catch (error) {
          console.error(error);

          purchaseMensaje.textContent =
            "❌ Error comunicándose con el servidor.";
        } finally {
          registrarCompra.disabled = false;
          registrarCompra.textContent = "Registrar compra en Meta";
        }
      });
      const logoutButton = document.getElementById("logout-button");

      logoutButton.addEventListener("click", async function () {
        try {
          const response = await fetch("/api/logout", {
            method: "POST",
          });

          if (!response.ok) {
            throw new Error("No se pudo cerrar la sesión");
          }

          window.location.href = "/login.html";
        } catch (error) {
          console.error("Error cerrando sesión:", error);
        }
      });
    </script>
  </body>
</html>
